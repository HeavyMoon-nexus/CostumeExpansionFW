; Costume Expansion FW - external config
; Place at: Data\SKSE\Plugins\CostumeExpansionFW.ini
; (under MO2: the CostumeExpansionFW mod's SKSE\Plugins folder, or Overwrite)
;
; Read ONCE when the game starts, BEFORE CEF touches anything - so you can edit
; it without launching the game.

[General]
; Master hard on/off for the whole plugin.
;   1 = enabled (normal; this is also the default if this file is absent)
;   0 = disabled: CEF installs no hooks and does no mesh injection / carrier work.
;
; Use bEnabled=0 as an emergency recovery switch: if a CEF-related crash leaves a
; save that no longer loads, set this to 0 and the save will open with CEF inert.
; (Equivalently, just create an empty file named CEF_DISABLE.txt next to this one -
; its mere presence forces CEF off, no editing needed.)
bEnabled=1

[Diagnostics]
; TROUBLESHOOTING LEVER - leave this at 1 unless a CEF developer asked you to
; change it. It is not a fix and not a supported way to play.
;
; When you add a costume to Persist, CEF rebuilds your character's head a couple
; of seconds later, so the persist costume can pick up its SMP physics. That
; rebuild is the most fragile thing CEF does. If you are chasing a crash that
; happens when adding to Persist, set this to 0 and try again:
;
;   crash goes away  -> the head rebuild is involved
;   crash still happens -> the cause is elsewhere; say so in your report
;
; With this at 0, persist costumes will NOT get SMP physics (they will hang
; static) until you set it back to 1.
bPersistHeadRebuild=1

; Verbose diagnostic logging ("debug mode"). Normal mode already records what a
; crash report needs; set this to 1 only when a CEF developer asked for a
; verbose log, or when a crash keeps coming back:
;
;   1) set bDebugMode=1, then just PLAY NORMALLY (no need to force anything)
;   2) after the next crash, send CostumeExpansionFW.log + the crash log
;      (both in Documents\My Games\Skyrim Special Edition\SKSE\)
;   3) set it back to 0 - the log gets large and flushing costs a little speed
;
; The same switch is available in game: SMF menu -> Costume Expansion FW ->
; Diagnostics (that one lasts for the session only). Debug mode changes what is
; LOGGED, never what CEF does.
bDebugMode=0

; Frame containment (SE/AE only). Every frame, just before the engine processes
; the player, CEF verifies the costume nodes it attached are still intact; if
; another mod overwrote one (a known crash-to-desktop cause), CEF repairs and
; re-injects it instead of letting the engine crash on it. Costs almost nothing
; and defuses a whole crash class - leave it at 1. Set to 0 ONLY if a CEF
; developer asks (falls back to the slower 2.5-second background check).
bFrameContainment=1
