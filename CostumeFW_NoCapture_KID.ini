; Costume Expansion FW - CEF_NoCapture opt-out keyword (v1.3.2, blacklist L3).
; Any ARMO carrying the CEF_NoCapture keyword is hidden from CEF's capture
; pickers ("+ Add worn item" / "+ Add from inventory") and refused by the
; capture gate - use it to keep utility/host armors out of CEF entirely.
;
; For MOD AUTHORS: either add the keyword to your ESP directly, or ship a
; _KID.ini like this one (Keyword Item Distributor, Nexus 55728). KID creates
; the CEF_NoCapture keyword at runtime - it does not need to exist as a
; record, and there is no ESP dependency in either direction.
;
; For USERS: uncomment / add lines below to tag items yourself. The file name
; must keep the "_KID" suffix, and KID inis have no [section] headers.
;
; LIMITATION: KID tags STATIC plugin records only. Runtime-created (FF-prefix)
; armors - e.g. MARA's "CORE Carrier" - cannot receive KID keywords; CEF
; blocks that whole class structurally instead (they are never capturable).
;
; Line grammar:  Keyword = CEF_NoCapture|Armor|<filter>
;
; Example - tag one specific armor record (formid + plugin):
;Keyword = CEF_NoCapture|Armor|0x800~SomeMod.esp
;
; Example - tag by EditorID:
;Keyword = CEF_NoCapture|Armor|MyModUtilityHarness
;
; Example - tag every armor whose display name contains "Harness"
; (* = wildcard/substring string filter):
;Keyword = CEF_NoCapture|Armor|*Harness
;
; Example - tag EVERY armor a plugin ships:
;Keyword = CEF_NoCapture|Armor|SomeUtilityMod.esp
